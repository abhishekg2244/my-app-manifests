
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
      - name: todo
        image: ghcr.io/abhishekg2244/argocd:f410e95fdd3ace6305daaba11790d88530378619
        ports:
        - containerPort: 80

      imagePullSecrets:
      - name: ghcr-secret