apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      containers:
      - name: todo
        image: docker pull ghcr.io/abhishekg2244/argocd:latest   # 🔥 CI यही update करेगा
        ports:
        - containerPort: 80
