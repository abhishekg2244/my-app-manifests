apiVersion: argoproj.io/v1alpha1 # ArgoCD Application resource
kind: Application               
metadata:                                                 
  name: nginx-app        
  namespace: argocd             
spec:
  project: default        
  source:
    repoURL: https://github.com/abhishekg2244/my-app-manifests.git  
    targetRevision: feature/m1      
    path: nginx   
  destination:
    server: https://kubernetes.default.svc  
    namespace: default          
  syncPolicy:                   
    automated:                  
      prune: true                 
      selfHeal: true              
    syncOptions:                 
      - CreateNamespace=true      